image:
  repository: servicing-ledger-demo
  tag: local
  pullPolicy: IfNotPresent

service:
  port: 8080
worker:
  pollSeconds: 2
storage:
  existingClaim: "" # Optional pre-provisioned single-writer PVC
  sizeLimit: 256Mi


auth:
  existingSecret: "" # Required: writer-token and operator-token keys

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: servicing-ledger
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Recreate prevents two pods with different ephemeral SQLite files serving together.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: servicing-ledger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servicing-ledger
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/app/servicing_api.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICING_DB_PATH
              value: /data/servicing.db
            - name: SERVICING_PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: demo-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: local-outbox-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/app/outbox_worker.py", "--poll-seconds", "{{ .Values.worker.pollSeconds }}"]
          env:
            - name: SERVICING_DB_PATH
              value: /data/servicing.db
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: demo-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: demo-data
          emptyDir:
            sizeLimit: {{ .Values.storage.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

